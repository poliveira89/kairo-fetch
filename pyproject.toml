[tool.poetry]
name = "kairo-fetch"
version = "0.3.0"
description = "CLI tool for fetching emails from Gmail and IMAP"
authors = ["Paulo Oliveira <poliveira89@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "kairo"}]

[tool.poetry.dependencies]
python = "^3.12"
click = "^8.1.0"
pydantic = "^1.10.0"
loguru = "^0.7.0"
playwright = "^1.40.0"

[tool.poetry.scripts]
kairo = "kairo.cli:cli"

[tool.poetry.group.dev.dependencies]
black = "^23.0"
isort = "^5.12.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
basedpyright = "^1.13.0"
bandit = "^1.9.4"
debugpy = "^1.8.20"
faker = "^40.18.0"

[tool.black]
line-length = 88
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | htmlcov
    | \.pytest_cache
    | \.mypy_cache
    | __pycache__
    | vibe-scratchpad-.*
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [".venv", "venv", "htmlcov", "vibe-scratchpad-*"]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["kairo", "tests"]
exclude = ["**/vibe-scratchpad-*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
